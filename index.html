<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ekip Defteri</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ekip Defteri">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f131b" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: telefon öncelikli tek sütun; üstte başlık, altta iki sekme ve yüzen + düğmesi; form alttan açılan sayfa */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --fg:#141a26; --muted:#5d6678; --line:#dde2ec;
  --accent:#2453c9; --accent-soft:#e6ecfb; --on-accent:#ffffff;
  --t-mesai:#2453c9; --t-izin:#b7720b; --t-malzeme:#1f8a5b; --t-not:#6b5bb5;
  --t-mesai-bg:#e6ecfb; --t-izin-bg:#fbf0dc; --t-malzeme-bg:#dff3e9; --t-not-bg:#ece9f8;
  --danger:#c0392b; --shadow:0 6px 24px rgba(20,26,38,.16);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f131b; --surface:#171c27; --fg:#e8ecf4; --muted:#949db0; --line:#2a3141;
  --accent:#7ea2ff; --accent-soft:#1f2a45; --on-accent:#0f131b;
  --t-mesai:#7ea2ff; --t-izin:#f0b75a; --t-malzeme:#5fd09b; --t-not:#ab9cf2;
  --t-mesai-bg:#1f2a45; --t-izin-bg:#3a2d16; --t-malzeme-bg:#173528; --t-not-bg:#2a2544;
  --danger:#ff7b6b; --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f131b; --surface:#171c27; --fg:#e8ecf4; --muted:#949db0; --line:#2a3141;
  --accent:#7ea2ff; --accent-soft:#1f2a45; --on-accent:#0f131b;
  --t-mesai:#7ea2ff; --t-izin:#f0b75a; --t-malzeme:#5fd09b; --t-not:#ab9cf2;
  --t-mesai-bg:#1f2a45; --t-izin-bg:#3a2d16; --t-malzeme-bg:#173528; --t-not-bg:#2a2544;
  --danger:#ff7b6b; --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark;}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(env(safe-area-inset-top,0px) + 16px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 120px)}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:1.3rem;font-weight:600;margin:0}
.hright{display:flex;align-items:center;gap:8px}
.sync{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 10px;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok .dot{background:var(--t-malzeme)} .sync.wait .dot{background:var(--t-izin)} .sync.err .dot{background:var(--danger)}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--fg)}

.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--muted);padding:9px;border-radius:9px;font-weight:500;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 13px;border-radius:999px;cursor:pointer;font-family:var(--mono);font-weight:500;font-size:.92rem}
.chip.txt{font-family:var(--sans)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

.day{display:flex;flex-direction:column;gap:8px}
.dayh{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:4px 2px 0}
.rec{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%;cursor:pointer}
.team{font-family:var(--mono);font-weight:600;font-size:.95rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 7px;min-width:48px;text-align:center}
.rbody{min-width:0;display:flex;flex-direction:column;gap:2px}
.rtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:6px}
.tag.mesai{color:var(--t-mesai);background:var(--t-mesai-bg)} .tag.izin{color:var(--t-izin);background:var(--t-izin-bg)}
.tag.malzeme{color:var(--t-malzeme);background:var(--t-malzeme-bg)} .tag.not{color:var(--t-not);background:var(--t-not-bg)}
.rmain{font-weight:600}
.rsub{color:var(--muted);font-size:.88rem}
.rnote{font-size:.92rem;overflow-wrap:anywhere;white-space:pre-wrap}
.pend{font-size:.72rem;color:var(--t-izin)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{color:var(--fg);display:block;margin-bottom:4px}
.more{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;cursor:pointer;color:var(--muted)}

.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav strong{font-size:1.05rem}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tot{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.tot .k{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tot .v{font-family:var(--mono);font-weight:600;font-size:.98rem;margin-top:2px;font-variant-numeric:tabular-nums}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tcard h3{margin:0;padding:12px 14px;font-size:1rem;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.tcard h3 .names{font-weight:400;color:var(--muted);font-size:.9rem}
.ptable{width:100%;border-collapse:collapse;font-size:.92rem}
.ptable th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:right;padding:8px 14px 4px}
.ptable th:first-child,.ptable td:first-child{text-align:left}
.ptable td{padding:6px 14px;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;border-top:1px solid var(--line)}
.ptable td:first-child{font-family:var(--sans)}
.mlist{padding:8px 14px 12px;display:flex;flex-direction:column;gap:4px;font-size:.88rem;border-top:1px solid var(--line)}
.mlist .mh{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.mlist div span{color:var(--muted)}

.fab{position:fixed;right:max(20px,calc(env(safe-area-inset-right,0px) + 20px));bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
  height:56px;padding:0 22px;border-radius:28px;border:0;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:1rem;box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;gap:8px;z-index:5}
.fab svg{width:20px;height:20px}

.scrim{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.sheeth{display:flex;align-items:center;justify-content:space-between}
.sheeth h2{margin:0;font-size:1.1rem}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.wrapchips{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg.two{grid-template-columns:1fr 1fr}
.seg button{border:0;background:transparent;color:var(--muted);padding:9px 4px;border-radius:8px;font-weight:500;cursor:pointer;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=url],textarea{
  font:inherit;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);min-width:0}
input[type=time],input[type=number]{font-family:var(--mono);font-weight:500}
textarea{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.calc{font-size:.9rem;color:var(--muted)}
.calc b{color:var(--fg);font-family:var(--mono)}
.primary{border:0;background:var(--accent);color:var(--on-accent);font-weight:600;padding:14px;border-radius:12px;cursor:pointer;font-size:1rem}
.primary:disabled{opacity:.45;cursor:not-allowed}
.secondary{border:1px solid var(--line);background:var(--surface);padding:12px;border-radius:12px;cursor:pointer;font-weight:500}
.danger{border:1px solid var(--danger);background:transparent;color:var(--danger);padding:12px;border-radius:12px;cursor:pointer;font-weight:500}
.danger.armed{background:var(--danger);color:var(--surface)}
.err{color:var(--danger);font-size:.88rem}
.help{font-size:.88rem;color:var(--muted)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.95rem}
.dl dt{color:var(--muted)} .dl dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 92px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.92rem;z-index:40;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ekip Defteri</h1>
    <div class="hright">
      <button class="sync" id="syncBtn" type="button" aria-label="Senkron durumu"><span class="dot"></span><span id="syncTxt">Yerel</span></button>
      <button class="iconbtn" id="setBtn" type="button" aria-label="Ayarlar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button id="tabList" role="tab" aria-selected="true" type="button">Kayıtlar</button>
    <button id="tabMonth" role="tab" aria-selected="false" type="button">Ay Özeti</button>
  </div>

  <section id="viewList" class="wrap" style="gap:14px">
    <div class="chips" id="teamFilter"></div>
    <div class="chips" id="typeFilter"></div>
    <div id="list" class="wrap" style="gap:14px"></div>
  </section>

  <section id="viewMonth" class="wrap" style="gap:14px" hidden>
    <div class="monthnav">
      <button class="iconbtn" id="mPrev" type="button" aria-label="Önceki ay">‹</button>
      <strong id="mLabel"></strong>
      <button class="iconbtn" id="mNext" type="button" aria-label="Sonraki ay">›</button>
    </div>
    <div class="totals" id="mTotals"></div>
    <div id="mTeams" class="wrap" style="gap:12px"></div>
  </section>
</div>

<button class="fab" id="addBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Kayıt</button>

<!-- Kayıt formu -->
<div class="scrim" id="formScrim" hidden>
  <form class="sheet" id="form" novalidate>
    <div class="sheeth"><h2 id="formTitle">Yeni kayıt</h2><button class="iconbtn" type="button" id="formClose" aria-label="Kapat">✕</button></div>
    <div class="field"><span class="lbl">Ekip</span><div class="wrapchips" id="fTeams"></div></div>
    <div class="field" id="fPersonWrap"><span class="lbl">Kişi</span><div class="wrapchips" id="fPersons"></div></div>
    <div class="field"><span class="lbl">Kayıt türü</span>
      <div class="seg" id="fType">
        <button type="button" data-t="mesai">Mesai</button><button type="button" data-t="izin">İzin</button>
        <button type="button" data-t="malzeme">Malzeme</button><button type="button" data-t="not">Not</button>
      </div></div>
    <label class="field"><span class="lbl">Tarih</span><input type="date" id="fDate"></label>

    <div id="grpMesai" class="wrap" style="gap:10px" hidden>
      <div class="row2">
        <label class="field"><span class="lbl">Başlangıç</span><input type="time" id="fStart" value="17:00"></label>
        <label class="field"><span class="lbl">Bitiş</span><input type="time" id="fEnd" value="20:00"></label>
      </div>
      <div class="calc" id="mesaiCalc"></div>
    </div>

    <div id="grpIzin" class="wrap" style="gap:10px" hidden>
      <div class="seg two" id="fIzinKind"><button type="button" data-k="saat" aria-pressed="true">Saatlik</button><button type="button" data-k="gun">Tam gün</button></div>
      <label class="field" id="izinSaatWrap"><span class="lbl">Kaç saat</span><input type="number" id="fIzinSaat" inputmode="decimal" min="0.5" step="0.5" value="2"></label>
      <label class="field" id="izinGunWrap" hidden><span class="lbl">Kaç gün</span><input type="number" id="fIzinGun" inputmode="numeric" min="1" step="1" value="1"></label>
    </div>

    <div id="grpMalzeme" class="wrap" style="gap:10px" hidden>
      <div class="row2" style="grid-template-columns:2fr 1fr">
        <label class="field"><span class="lbl">Malzeme</span><input type="text" id="fMal" placeholder="Ör. patch kablo" autocomplete="off"></label>
        <label class="field"><span class="lbl">Adet</span><input type="number" id="fAdet" inputmode="numeric" min="1" step="1" value="1"></label>
      </div>
    </div>

    <label class="field"><span class="lbl" id="noteLbl">Not (isteğe bağlı)</span><textarea id="fNote" placeholder="Açıklama, sebep, iş emri no…"></textarea></label>
    <div class="err" id="fErr" hidden></div>
    <button class="primary" type="submit" id="fSave">Kaydet</button>
  </form>
</div>

<!-- Kayıt detayı -->
<div class="scrim" id="detScrim" hidden>
  <div class="sheet">
    <div class="sheeth"><h2>Kayıt</h2><button class="iconbtn" type="button" id="detClose" aria-label="Kapat">✕</button></div>
    <dl class="dl" id="detBody"></dl>
    <div class="btnrow">
      <button class="secondary" type="button" id="detEdit">Düzenle</button>
      <button class="danger" type="button" id="detDel">Sil</button>
    </div>
  </div>
</div>

<!-- Ayarlar -->
<div class="scrim" id="setScrim" hidden>
  <div class="sheet">
    <div class="sheeth"><h2>Ayarlar</h2><button class="iconbtn" type="button" id="setClose" aria-label="Kapat">✕</button></div>
    <div class="field"><span class="lbl">Tema</span>
      <div class="seg" id="themeSeg" style="grid-template-columns:repeat(3,1fr)">
        <button type="button" data-th="">Otomatik</button><button type="button" data-th="light">Açık</button><button type="button" data-th="dark">Koyu</button>
      </div></div>
    <label class="field"><span class="lbl">Google E-Tablo bağlantısı</span>
      <input type="url" id="setUrl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></label>
    <p class="help" id="setHelp">Bağlantı girilmezse kayıtlar yalnızca bu cihazda tutulur. Bağlantı girince tüm kayıtlar Google E-Tablo'na da yazılır ve her açılışta oradan okunur.</p>
    <div class="err" id="setErr" hidden></div>
    <div class="btnrow">
      <button class="secondary" type="button" id="setSync">Şimdi senkronla</button>
      <button class="primary" type="button" id="setSave">Kaydet</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Sabitler ---------- */
const TEAMS=[
  {no:"101",kisi:["Serkan"]},
  {no:"102",kisi:["Mert","Yasin"]},
  {no:"103",kisi:["Ümit","Kadir"]},
  {no:"104",kisi:["Mustafa","Yalçın"]},
  {no:"106",kisi:["Ömer","Bahtiyar"]},
  {no:"118",kisi:["Semih","Yusuf"]},
  {no:"119",kisi:["Rıdvan","Hasan Can"]},
  {no:"506",kisi:["Hasan"]},
];
const TYPES={mesai:"Mesai",izin:"İzin",malzeme:"Malzeme",not:"Not"};
const GENEL="Ekip geneli";
const TZ="Europe/Istanbul";
const LS={recs:"ed_recs",pend:"ed_pend",url:"ed_url",theme:"ed_theme"};
const $=id=>document.getElementById(id);

/* ---------- Depolama ---------- */
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
let records=lsGet(LS.recs,{});          // id -> kayıt
let pending=lsGet(LS.pend,[]);          // gönderilmeyi bekleyen işlemler
let scriptUrl=lsGet(LS.url,"");
function persist(){lsSet(LS.recs,records);lsSet(LS.pend,pending);}

/* ---------- Tarih yardımcıları ---------- */
const fKey=new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"});
const todayKey=()=>fKey.format(new Date());
function keyToDate(k){const [y,m,d]=k.split("-").map(Number);return new Date(Date.UTC(y,m-1,d,12));}
const fDay=new Intl.DateTimeFormat("tr-TR",{timeZone:"UTC",day:"numeric",month:"long",weekday:"long"});
const fDayY=new Intl.DateTimeFormat("tr-TR",{timeZone:"UTC",day:"numeric",month:"long",year:"numeric",weekday:"long"});
const fMonth=new Intl.DateTimeFormat("tr-TR",{timeZone:"UTC",month:"long",year:"numeric"});
function dayLabel(k){
  const t=todayKey(); if(k===t)return "Bugün";
  const y=new Date(keyToDate(t).getTime()-864e5).toISOString().slice(0,10); if(k===y)return "Dün";
  return (k.slice(0,4)===t.slice(0,4)?fDay:fDayY).format(keyToDate(k));
}
function hm(hours){
  const mins=Math.round((+hours||0)*60); const h=Math.floor(mins/60), m=mins%60;
  if(!h&&!m)return "0 dk"; return (h?h+" sa":"")+(h&&m?" ":"")+(m?m+" dk":"");
}
function mesaiHours(s,e){
  if(!s||!e)return 0; const [a,b]=s.split(":").map(Number),[c,d]=e.split(":").map(Number);
  let m=(c*60+d)-(a*60+b); if(m<=0)m+=1440; return Math.round(m/60*100)/100;
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- Kayıt özetleri ---------- */
function mainLine(r){
  if(r.tur==="mesai")return `${hm(r.sure)}  ·  ${r.baslangic}–${r.bitis}`;
  if(r.tur==="izin")return r.gun?`${r.gun} gün izin`:`${hm(r.sure)} izin`;
  if(r.tur==="malzeme")return `${r.adet||1} × ${r.malzeme}`;
  return "";
}

/* ---------- Görünüm durumu ---------- */
let fTeam="", fTur="", shown=60;
let monthKey=todayKey().slice(0,7);

function renderFilters(){
  $("teamFilter").innerHTML=[`<button class="chip txt" type="button" data-v="" aria-pressed="${!fTeam}">Tüm ekipler</button>`]
    .concat(TEAMS.map(t=>`<button class="chip" type="button" data-v="${t.no}" aria-pressed="${fTeam===t.no}">${t.no}</button>`)).join("");
  $("typeFilter").innerHTML=[`<button class="chip txt" type="button" data-v="" aria-pressed="${!fTur}">Hepsi</button>`]
    .concat(Object.entries(TYPES).map(([k,v])=>`<button class="chip txt" type="button" data-v="${k}" aria-pressed="${fTur===k}">${v}</button>`)).join("");
}
$("teamFilter").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;fTeam=b.dataset.v;shown=60;renderFilters();renderList();});
$("typeFilter").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;fTur=b.dataset.v;shown=60;renderFilters();renderList();});

function sorted(){
  return Object.values(records).sort((a,b)=>(b.tarih+b.olusturma).localeCompare(a.tarih+a.olusturma));
}
function isPending(id){return pending.some(p=>p.id===id);}

function renderList(){
  const all=sorted().filter(r=>(!fTeam||r.ekip===fTeam)&&(!fTur||r.tur===fTur));
  if(!all.length){
    $("list").innerHTML=Object.keys(records).length
      ?`<div class="empty"><b>Bu filtreye uyan kayıt yok</b>Başka bir ekip ya da tür seç.</div>`
      :`<div class="empty"><b>Henüz kayıt yok</b>Sağ alttaki “Kayıt” düğmesiyle mesai, izin, malzeme ya da not ekleyebilirsin.</div>`;
    return;
  }
  const items=all.slice(0,shown); let html="", cur="";
  for(const r of items){
    if(r.tarih!==cur){ if(cur)html+="</div>"; cur=r.tarih; html+=`<div class="day"><div class="dayh">${esc(dayLabel(cur))}</div>`; }
    const ml=mainLine(r);
    html+=`<button class="rec" type="button" data-id="${esc(r.id)}">
      <span class="team">${esc(r.ekip)}</span>
      <span class="rbody">
        <span class="rtop"><span class="tag ${r.tur}">${TYPES[r.tur]}</span><span class="rsub">${esc(r.kisi||GENEL)}</span>${isPending(r.id)&&scriptUrl?'<span class="pend">gönderilmedi</span>':""}</span>
        ${ml?`<span class="rmain">${esc(ml)}</span>`:""}
        ${r.not?`<span class="rnote">${esc(r.not)}</span>`:""}
      </span></button>`;
  }
  html+="</div>";
  if(all.length>shown)html+=`<button class="more" type="button" id="moreBtn">Daha fazla göster (${all.length-shown})</button>`;
  $("list").innerHTML=html;
  const mb=$("moreBtn"); if(mb)mb.onclick=()=>{shown+=60;renderList();};
}
$("list").addEventListener("click",e=>{const b=e.target.closest(".rec");if(b)openDetail(b.dataset.id);});

/* ---------- Ay özeti ---------- */
function renderMonth(){
  $("mLabel").textContent=fMonth.format(keyToDate(monthKey+"-01")).replace(/^./,c=>c.toLocaleUpperCase("tr"));
  const recs=Object.values(records).filter(r=>r.tarih.startsWith(monthKey));
  let tM=0,tI=0,tG=0,tMal=0;
  const html=TEAMS.map(t=>{
    const tr=recs.filter(r=>r.ekip===t.no);
    const people=[...t.kisi]; tr.forEach(r=>{if(r.kisi&&!people.includes(r.kisi))people.push(r.kisi);});
    const rows=people.map(p=>{
      const pr=tr.filter(r=>r.kisi===p);
      const m=pr.filter(r=>r.tur==="mesai").reduce((s,r)=>s+(+r.sure||0),0);
      const ih=pr.filter(r=>r.tur==="izin"&&!r.gun).reduce((s,r)=>s+(+r.sure||0),0);
      const ig=pr.filter(r=>r.tur==="izin"&&r.gun).reduce((s,r)=>s+(+r.gun||0),0);
      const ma=pr.filter(r=>r.tur==="malzeme").length;
      tM+=m;tI+=ih;tG+=ig;tMal+=ma;
      const iz=[ih?hm(ih):"",ig?ig+" gün":""].filter(Boolean).join(" + ")||"–";
      return `<tr><td>${esc(p)}</td><td>${m?hm(m):"–"}</td><td>${iz}</td><td>${ma||"–"}</td></tr>`;
    }).join("");
    const mats=tr.filter(r=>r.tur==="malzeme").sort((a,b)=>a.tarih.localeCompare(b.tarih));
    const notes=tr.filter(r=>r.tur==="not").length;
    const matHtml=mats.length?`<div class="mlist"><span class="mh">Verilen malzemeler</span>${mats.map(r=>`<div>${esc(r.adet||1)} × ${esc(r.malzeme)} <span>· ${esc(r.kisi)} · ${keyToDate(r.tarih).getUTCDate()} ${fMonth.format(keyToDate(r.tarih)).split(" ")[0]}</span></div>`).join("")}</div>`:"";
    return `<div class="tcard"><h3><span class="team">${t.no}</span><span class="names">${esc(t.kisi.join(", "))}${notes?` · ${notes} not`:""}</span></h3>
      <div style="overflow-x:auto"><table class="ptable"><thead><tr><th>Kişi</th><th>Mesai</th><th>İzin</th><th>Malzeme</th></tr></thead><tbody>${rows}</tbody></table></div>${matHtml}</div>`;
  }).join("");
  $("mTotals").innerHTML=`<div class="tot"><div class="k">Mesai</div><div class="v">${hm(tM)}</div></div>
    <div class="tot"><div class="k">İzin</div><div class="v">${[tI?hm(tI):"",tG?tG+" gün":""].filter(Boolean).join(" + ")||"0"}</div></div>
    <div class="tot"><div class="k">Malzeme</div><div class="v">${tMal} kayıt</div></div>`;
  $("mTeams").innerHTML=recs.length?html:`<div class="empty"><b>Bu ayda kayıt yok</b>Eklediğin kayıtlar burada ekip ve kişi bazında toplanır.</div>`;
}
function shiftMonth(n){const [y,m]=monthKey.split("-").map(Number);const d=new Date(Date.UTC(y,m-1+n,1));monthKey=d.toISOString().slice(0,7);renderMonth();}
$("mPrev").onclick=()=>shiftMonth(-1); $("mNext").onclick=()=>shiftMonth(1);

/* ---------- Sekmeler ---------- */
function setTab(t){
  const list=t==="list"; $("tabList").setAttribute("aria-selected",list); $("tabMonth").setAttribute("aria-selected",!list);
  $("viewList").hidden=!list; $("viewMonth").hidden=list; if(!list)renderMonth();
}
$("tabList").onclick=()=>setTab("list"); $("tabMonth").onclick=()=>setTab("month");
function renderAll(){renderList();if(!$("viewMonth").hidden)renderMonth();renderSync();}

/* ---------- Form ---------- */
let form={}, editId=null;
function openForm(rec){
  editId=rec?rec.id:null;
  form=rec?{...rec}:{ekip:fTeam||"",kisi:"",tur:fTur||"mesai",tarih:todayKey()};
  if(!rec && form.ekip){const t=TEAMS.find(x=>x.no===form.ekip); if(t&&t.kisi.length===1)form.kisi=t.kisi[0];}
  $("formTitle").textContent=rec?"Kaydı düzenle":"Yeni kayıt";
  $("fDate").value=form.tarih;
  $("fStart").value=form.baslangic||"17:00"; $("fEnd").value=form.bitis||"20:00";
  izinKind=form.gun?"gun":"saat"; $("fIzinSaat").value=form.gun?2:(form.sure||2); $("fIzinGun").value=form.gun||1;
  $("fMal").value=form.malzeme||""; $("fAdet").value=form.adet||1; $("fNote").value=form.not||"";
  $("fErr").hidden=true;
  renderForm(); $("formScrim").hidden=false;
}
function closeForm(){$("formScrim").hidden=true;}
let izinKind="saat";
function renderForm(){
  $("fTeams").innerHTML=TEAMS.map(t=>`<button class="chip" type="button" data-v="${t.no}" aria-pressed="${form.ekip===t.no}">${t.no}</button>`).join("");
  const t=TEAMS.find(x=>x.no===form.ekip);
  $("fPersonWrap").hidden=!t;
  if(t){
    const opts=[...t.kisi]; if(form.tur==="not")opts.push(GENEL);
    if(form.kisi&&form.kisi!==GENEL&&!opts.includes(form.kisi))opts.unshift(form.kisi);
    $("fPersons").innerHTML=opts.map(p=>`<button class="chip txt" type="button" data-v="${esc(p)}" aria-pressed="${(form.kisi||(form.tur==="not"?GENEL:""))===p}">${esc(p)}</button>`).join("");
  }
  [...$("fType").children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===form.tur));
  $("grpMesai").hidden=form.tur!=="mesai"; $("grpIzin").hidden=form.tur!=="izin"; $("grpMalzeme").hidden=form.tur!=="malzeme";
  [...$("fIzinKind").children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===izinKind));
  $("izinSaatWrap").hidden=izinKind!=="saat"; $("izinGunWrap").hidden=izinKind!=="gun";
  $("noteLbl").textContent=form.tur==="not"?"Not":form.tur==="izin"?"Sebep (isteğe bağlı)":"Not (isteğe bağlı)";
  updCalc();
}
function updCalc(){const h=mesaiHours($("fStart").value,$("fEnd").value);$("mesaiCalc").innerHTML=h?`Süre: <b>${hm(h)}</b>${$("fEnd").value<=$("fStart").value?" (ertesi güne geçiyor)":""}`:"";}
$("fStart").oninput=updCalc; $("fEnd").oninput=updCalc;
$("fTeams").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;form.ekip=b.dataset.v;const t=TEAMS.find(x=>x.no===form.ekip);form.kisi=t.kisi.length===1?t.kisi[0]:"";renderForm();});
$("fPersons").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;form.kisi=b.dataset.v;renderForm();});
$("fType").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;form.tur=b.dataset.t;if(form.kisi===GENEL&&form.tur!=="not")form.kisi="";renderForm();});
$("fIzinKind").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;izinKind=b.dataset.k;renderForm();});
$("formClose").onclick=closeForm;
$("formScrim").addEventListener("click",e=>{if(e.target===$("formScrim"))closeForm();});

$("form").addEventListener("submit",e=>{
  e.preventDefault();
  const err=m=>{$("fErr").textContent=m;$("fErr").hidden=false;};
  if(!form.ekip)return err("Bir ekip seç.");
  const kisi=form.kisi===GENEL?"":form.kisi;
  if(form.tur!=="not"&&!kisi)return err("Kaydın kime ait olduğunu seç.");
  const tarih=$("fDate").value; if(!tarih)return err("Tarih gir.");
  const r={id:editId||uid(),olusturma:editId?(records[editId]?.olusturma||new Date().toISOString()):new Date().toISOString(),
    tarih,ekip:form.ekip,kisi,tur:form.tur,baslangic:"",bitis:"",sure:"",gun:"",malzeme:"",adet:"",not:$("fNote").value.trim()};
  if(r.tur==="mesai"){r.baslangic=$("fStart").value;r.bitis=$("fEnd").value;if(!r.baslangic||!r.bitis)return err("Başlangıç ve bitiş saatini gir.");r.sure=String(mesaiHours(r.baslangic,r.bitis));}
  if(r.tur==="izin"){if(izinKind==="gun"){const g=parseInt($("fIzinGun").value,10);if(!(g>0))return err("Gün sayısını gir.");r.gun=String(g);}
    else{const s=parseFloat(String($("fIzinSaat").value).replace(",","."));if(!(s>0))return err("İzin süresini saat olarak gir.");r.sure=String(s);}}
  if(r.tur==="malzeme"){r.malzeme=$("fMal").value.trim();if(!r.malzeme)return err("Malzemenin adını yaz.");const a=parseInt($("fAdet").value,10);r.adet=String(a>0?a:1);}
  if(r.tur==="not"&&!r.not)return err("Notu yaz.");
  records[r.id]=r; queue({op:"upsert",id:r.id,rec:r});
  closeForm(); renderAll(); toast(editId?"Kayıt güncellendi":"Kayıt eklendi");
});

/* ---------- Detay ---------- */
let detId=null;
function openDetail(id){
  const r=records[id]; if(!r)return; detId=id;
  const rows=[["Tarih",dayLabel(r.tarih)+(dayLabel(r.tarih).length<6?` (${fDayY.format(keyToDate(r.tarih))})`:"")],["Ekip",r.ekip],["Kişi",r.kisi||GENEL],["Tür",TYPES[r.tur]]];
  if(r.tur==="mesai")rows.push(["Saat",`${r.baslangic} – ${r.bitis}`],["Süre",hm(r.sure)]);
  if(r.tur==="izin")rows.push(["Süre",r.gun?r.gun+" gün":hm(r.sure)]);
  if(r.tur==="malzeme")rows.push(["Malzeme",r.malzeme],["Adet",r.adet||"1"]);
  if(r.not)rows.push([r.tur==="izin"?"Sebep":"Not",r.not]);
  $("detBody").innerHTML=rows.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join("");
  $("detDel").classList.remove("armed"); $("detDel").textContent="Sil";
  $("detScrim").hidden=false;
}
$("detClose").onclick=()=>$("detScrim").hidden=true;
$("detScrim").addEventListener("click",e=>{if(e.target===$("detScrim"))$("detScrim").hidden=true;});
$("detEdit").onclick=()=>{$("detScrim").hidden=true;openForm(records[detId]);};
$("detDel").onclick=()=>{
  const b=$("detDel");
  if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="Silmek için tekrar dokun";return;}
  delete records[detId]; queue({op:"delete",id:detId}); $("detScrim").hidden=true; renderAll(); toast("Kayıt silindi");
};

/* ---------- Google E-Tablo senkronu ---------- */
let syncState="local", syncing=false, lastErr="";
function queue(op){
  pending=pending.filter(p=>p.id!==op.id); // aynı kayda ait eski işlem gereksiz
  pending.push(op); persist(); if(scriptUrl)sync();
}
function renderSync(){
  const el=$("syncBtn"); el.className="sync";
  let t="Yerel";
  if(scriptUrl){
    if(syncing)t="Senkronlanıyor…";
    else if(syncState==="err"){t="Bağlantı hatası";el.classList.add("err");}
    else if(pending.length){t=`${pending.length} bekliyor`;el.classList.add("wait");}
    else {t="E-Tablo ile senkron";el.classList.add("ok");}
  }
  $("syncTxt").textContent=t;
}
async function sync(){
  if(!scriptUrl||syncing)return; syncing=true; renderSync();
  try{
    if(pending.length){
      const ops=pending.slice();
      const res=await fetch(scriptUrl,{method:"POST",body:JSON.stringify({ops})});
      const j=await res.json(); if(!j.ok)throw new Error(j.error||"Yazma hatası");
      pending=pending.filter(p=>!ops.includes(p)); persist();
    }
    const res=await fetch(scriptUrl+(scriptUrl.includes("?")?"&":"?")+"t="+Date.now());
    const j=await res.json(); if(!j.ok)throw new Error(j.error||"Okuma hatası");
    const next={}; j.rows.forEach(r=>{if(r.id)next[r.id]=normalize(r);});
    pending.forEach(p=>{if(p.op==="upsert")next[p.id]=p.rec;else delete next[p.id];});
    records=next; persist(); syncState="ok"; lastErr="";
  }catch(e){syncState="err"; lastErr=e.message||String(e);}
  syncing=false; renderAll();
}
function normalize(r){const o={};["id","olusturma","tarih","ekip","kisi","tur","baslangic","bitis","sure","gun","malzeme","adet","not"].forEach(k=>o[k]=r[k]==null?"":String(r[k]));return o;}
window.addEventListener("online",sync);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)sync();});

/* ---------- Ayarlar ---------- */
function openSettings(){
  $("setUrl").value=scriptUrl; $("setErr").hidden=!(scriptUrl&&syncState==="err");
  $("setErr").textContent=lastErr?`Son senkron başarısız: ${lastErr}. Bağlantıyı ve E-Tablo'daki dağıtım ayarını kontrol et.`:"";
  [...$("themeSeg").children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.th===(lsGet(LS.theme,"")||"")));
  $("setScrim").hidden=false;
}
$("setBtn").onclick=openSettings; $("syncBtn").onclick=()=>{if(scriptUrl)sync();else openSettings();};
$("setClose").onclick=()=>$("setScrim").hidden=true;
$("setScrim").addEventListener("click",e=>{if(e.target===$("setScrim"))$("setScrim").hidden=true;});
$("setSave").onclick=async()=>{
  const u=$("setUrl").value.trim();
  if(u&&!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(u)){$("setErr").textContent="Bu bir Google Apps Script bağlantısına benzemiyor. “https://script.google.com/macros/s/…/exec” şeklinde olmalı.";$("setErr").hidden=false;return;}
  const first=!scriptUrl&&u;
  scriptUrl=u; lsSet(LS.url,u);
  if(first){Object.values(records).forEach(r=>{if(!pending.some(p=>p.id===r.id))pending.push({op:"upsert",id:r.id,rec:r});});persist();}
  $("setScrim").hidden=true; toast(u?"Bağlantı kaydedildi":"Yerel moda geçildi"); renderSync(); if(u)sync();
};
$("setSync").onclick=()=>{$("setScrim").hidden=true;sync();};
$("themeSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;lsSet(LS.theme,b.dataset.th);applyTheme(b.dataset.th);[...$("themeSeg").children].forEach(x=>x.setAttribute("aria-pressed",x===b));});
function applyTheme(t){const r=document.documentElement;if(t)r.setAttribute("data-theme",t);else r.removeAttribute("data-theme");}
applyTheme(lsGet(LS.theme,""));

/* ---------- Diğer ---------- */
let tt; function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,1800);}
$("addBtn").onclick=()=>openForm(null);
document.addEventListener("keydown",e=>{if(e.key==="Escape"){["formScrim","detScrim","setScrim"].forEach(id=>$(id).hidden=true);}});

renderFilters(); renderAll(); sync();
</script>
